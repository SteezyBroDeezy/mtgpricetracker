name: Deploy Firestore Indexes
# Manual only. Index configuration changes rarely, and applying it is
# not something that should ride along with the daily price run.
#
# This exists because the exemptions cannot be applied from a laptop
# without an interactive `firebase login`, while the service account
# that already writes prices every day is sitting right here as a
# secret. Same credential, no new one to manage.
on:
  workflow_dispatch:
jobs:
  deploy-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/sa.json"
      - name: Report which identity is deploying
        # Index configuration needs roles/datastore.indexAdmin, which is
        # not part of the Firebase Admin SDK role the price tracker runs
        # under. Printing the account makes granting it unambiguous. An
        # address is an identifier, not a credential; the key itself
        # never leaves the runner.
        run: python3 -c "import json;d=json.load(open('$RUNNER_TEMP/sa.json'));print('service account:',d['client_email']);print('project:',d['project_id'])"
      - name: Show the live security rules
        # Rules are not in this repo. Printing them is the only safe
        # prelude to changing them, and a new collection is invisible to
        # the site until they name it.
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/show-rules.js
      - name: Show the index configuration already in the project
        # Printed before any change so the composite indexes that exist
        # in the project are on the record. firestore.indexes.json is
        # the input to a --force deploy, and anything missing from it
        # would be what --force deletes.
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@15 firestore:indexes --project mtg-card-search-e0ed3
      - name: Deploy index configuration
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        # No --force. Without it the CLI will not delete indexes that
        # exist in the project but not in the file, so a mistake here
        # costs a warning rather than an index rebuild.
        run: npx --yes firebase-tools@15 deploy --only firestore:indexes --project mtg-card-search-e0ed3
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
