name: Daily Price Tracker
on:
  schedule:
    # GitHub delays scheduled workflows by hours when its queue is busy,
    # and drops them entirely often enough to matter: runs meant for
    # 08:00 UTC landed at 18:43, 19:49 and 13:31 on consecutive days in
    # August 2026. So this asks three times rather than once, and the
    # tracker no-ops (two reads) on any attempt after the day is already
    # recorded. Minute 37 on purpose — the top of the hour is when
    # everyone else schedules, and is the most delayed slot.
    - cron: '37 8 * * *'    # primary, after Scryfall's nightly price update
    - cron: '37 13 * * *'   # backstop if the morning run was delayed or dropped
    - cron: '37 19 * * *'   # last chance before the quota day rolls over
  workflow_dispatch:
    inputs:
      force:
        description: 'Rewrite today even if it is already recorded'
        type: boolean
        default: false
jobs:
  track-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Never let two attempts overlap; a second pass mid-run would write
    # the same day twice and double the quota cost.
    concurrency:
      group: price-tracker
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Stay on 20. Node 24 ships npm 11, which blocks package
          # lifecycle scripts by default; protobufjs's postinstall then
          # never runs and firebase-admin loads with admin.credential
          # undefined. The "Node.js 20 is deprecated" warning in the log
          # is about the runtime of actions/checkout and setup-node
          # themselves, not about this input — bumping it here does not
          # silence that warning and does break the job.
          node-version: '20'
      - name: Install dependencies
        # Pinned to the major that is known to work here. Unpinned, a new
        # major lands on some future run and breaks the job with no change
        # to this repo. Note firebase-admin 14 declares engines node>=22
        # while this runs on 20 — npm treats that as advisory, and it has
        # worked in practice; revisit together, not separately.
        run: npm install firebase-admin@14 node-fetch@2
      - name: Run price tracker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ inputs.force && '1' || '0' }}
        run: node scripts/track-prices.js
